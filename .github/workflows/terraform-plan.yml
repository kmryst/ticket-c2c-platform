name: terraform-plan

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 環境 root module を追加したらここに足す
        environment: [bootstrap, dev, staging]
    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.environment }}
    env:
      # alert_email は既定値を持たない（Issue #623）。repository secret ALERT_EMAIL から渡す。
      # secret が渡らない（fork からの PR など）場合は空文字になり、variables.tf の validation で dev / staging の plan が失敗する。
      # bootstrap root はこの変数を宣言していないため、TF_VAR_alert_email は無視される。
      TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.8"

      - name: Configure AWS credentials (plan role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../..

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        run: |
          terraform plan -input=false -lock=false -no-color -out=tfplan.bin | tee plan.txt
          {
            echo "## terraform plan (${{ matrix.environment }})"
            echo '```'
            grep -E "^(Plan:|No changes|  # )" plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
