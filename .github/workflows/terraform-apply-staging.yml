# staging 専用の terraform apply workflow（staging-environment.md「GitHub Actions」）。
# 環境選択入力は持たず、staging 固有の capacity_profile のみ受け取る。
# full への追加 confirm は置かない。staging は使い捨てで、誤って full で立てても destroy すれば済むため。
# GitHub Environment `staging` は branch restriction（main のみ）で、required reviewer は置かない（ADR-0038）。
name: terraform-apply-staging

on:
  workflow_dispatch:
    inputs:
      capacity_profile:
        description: "staging の構成サイズ・冗長化 profile（normal: 通常検証 / full: 負荷・failover 検証）"
        required: true
        type: choice
        options: [normal, full]
        default: normal
      public_endpoint_mode:
        description: "公開エンドポイント（https-dns: ticket-api-staging.ticket-c2c.click + ACM / alb-http-only: ALB HTTP のみ）"
        required: true
        type: choice
        options: [https-dns, alb-http-only]
        default: https-dns
      task_config_check_value:
        description: "AWS での確認用に api / worker / frontend の task definition へ入れる環境変数 TASK_CONFIG_CHECK_VALUE の値（アプリは読まない。空なら入れない。Issue #544 / ADR-0042）"
        required: false
        type: string
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  # staging を変更する workflow（terraform apply / destroy、backend / frontend deploy、DB migration、
  # Ticket Type readiness / cutover）を 1 つの group で直列化する（Issue #544 / ADR-0042）。
  # deploy は terraform が最後の apply で登録した task definition を state から読むため、apply と並行させない。
  # 既定（queue: single）は待機中の run を 1 件しか持たず、後から起動した run が待機中の run を cancel する。
  # queue: max で待機中の run を cancel せず起動順に実行する（pr-policy-check.yml / Issue #220 と同じ）。
  group: mutation-staging
  queue: max

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: staging
    defaults:
      run:
        working-directory: terraform/environments/staging
    env:
      TF_VAR_capacity_profile: ${{ inputs.capacity_profile }}
      TF_VAR_public_endpoint_mode: ${{ inputs.public_endpoint_mode }}
      TF_VAR_task_config_check_value: ${{ inputs.task_config_check_value }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.8"

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan.bin

      - name: Terraform apply
        run: terraform apply -input=false -no-color tfplan.bin

      - name: Outputs
        run: |
          {
            echo "capacity_profile: ${{ inputs.capacity_profile }} / public_endpoint_mode: ${{ inputs.public_endpoint_mode }}"
            terraform output -no-color
          } >> "$GITHUB_STEP_SUMMARY"
