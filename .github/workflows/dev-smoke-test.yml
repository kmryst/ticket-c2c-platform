# dev の配線を検証する smoke test workflow（staging-smoke-test.yml を踏襲。Issue #192）。
# apply ロールは流用せず、dev state の S3 read-only に限定した専用ロール
# （Environment `dev-readonly`）で `terraform output` を取得する。
# 以降の HTTP 検証（scripts/staging/smoke-test.ts）は AWS credential を使わない。
# 外形監視（CloudWatch Synthetics canary）の状態確認だけは同じロールで synthetics:GetCanary を呼ぶ（Issue #546）。
# dev は CloudFront 統合オリジン + ALB 直叩き遮断（ADR-0011 / ADR-0013）が常設のため、
# base URL は常に CloudFront 経由（dev/outputs.tf の api_base_url）。
# dev の test data は destroy まで残存する（dev は平常時 destroy 済みが正常状態。dev-environment.md）。
name: dev-smoke-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: dev-smoke-test

jobs:
  smoke:
    runs-on: ubuntu-latest
    environment: dev-readonly
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.8"
          # terraform output の生値を取得するため wrapper を無効化する
          terraform_wrapper: false

      - name: Configure AWS credentials (dev state read-only role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEV_READONLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Resolve dev base URL from terraform output
        id: tf
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false
          BASE_URL=$(terraform output -raw api_base_url)
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "base URL: $BASE_URL" >> "$GITHUB_STEP_SUMMARY"

      # Issue #546 / ADR-0043: 外形監視（CloudWatch Synthetics canary）は最初の deploy の後、
      # 2 回目の apply（enable_synthetic_check=true）で作る。その apply を忘れていないかを、canary が state にあり、
      # AWS 上で RUNNING であることで確かめる。読み取りは synthetics:GetCanary だけ（bootstrap の read-only ロール）。
      - name: Check synthetic check canary is RUNNING
        working-directory: terraform/environments/dev
        run: |
          terraform output -json > outputs.json
          CANARY_NAME=$(jq -r '.synthetic_check_canary_name.value // empty' outputs.json)
          if [ -z "$CANARY_NAME" ]; then
            echo "::error::外形監視（CloudWatch Synthetics canary）が無い。deploy-backend-dev.yml → deploy-frontend-dev.yml の後、terraform-apply-dev.yml を enable_synthetic_check=true で実行する（Issue #546 / ADR-0043）"
            exit 1
          fi
          # canary は us-east-1 に作る（terraform/modules/synthetics-canary）
          CANARY_STATE=$(aws synthetics get-canary --region us-east-1 --name "$CANARY_NAME" \
            --query 'Canary.Status.State' --output text)
          echo "synthetic check canary: $CANARY_NAME ($CANARY_STATE)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CANARY_STATE" != "RUNNING" ]; then
            echo "::error::外形監視 $CANARY_NAME の状態が RUNNING ではない（$CANARY_STATE）。docs/runbooks/alarm-synthetic-check-failure.md を参照する"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run smoke test (HTTP only, no AWS credential)
        # 明示的な shell: bash で pipefail を有効化し、tee がテスト失敗の exit code を隠さないようにする
        shell: bash
        env:
          SMOKE_TEST_BASE_URL: ${{ steps.tf.outputs.base_url }}
          # smoke test 本体に AWS credential を渡さない（設計方針）
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: npm run smoke:dev | tee smoke.log

      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            tail -n 20 smoke.log 2>/dev/null || echo "no smoke.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
