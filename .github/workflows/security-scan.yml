# セキュリティスキャン統合ワークフロー
# 目的: 依存関係とコンテナイメージの脆弱性を定期スキャンし GitHub Security タブで一元管理する
# 移植元: kmryst/terraform-hannibal .github/workflows/security-scan.yml
# （移植時点では container-scan ジョブを対象外にしていたが、Issue #471 で
#   idp-golden-path の reusable workflow 版 Trivy Image Scan として取り込んだ）
# コードの脆弱性（CodeQL javascript-typescript）は .github/workflows/codeql.yml に一本化した
# （idp-golden-pathのreusable workflow経由でPRごとに実行。Issue #305）。
# 本ファイルにあった sast-scan job（週次のみ実行、PR非トリガー）は重複のため削除した。
# IaC / Dockerfile の設定不備（misconfiguration）は .github/workflows/trivy-config-scan.yml が担当する。
# スキャンの責務分担は docs/operations/security-scanning.md を参照。

name: Security Scan
on:
  workflow_dispatch:
  schedule:
    # 毎週月曜 00:15 UTC / 09:15 JST。
    # 毎時0分付近の GitHub Actions 混雑を避けるため15分にずらす。
    - cron: "15 0 * * 1"

concurrency:
  # 呼び出し先の trivy-image.yml は workflow レベルの concurrency を持たない
  # （backend / frontend の並行 scan が通常の使い方で、callee 側に group を置くと相互キャンセルするため）。
  # よって caller/callee 間のデッドロック（ADR-0008 追記 2026-07-13 / idp-golden-path#106）は
  # 起きず、既存の group 名をそのまま維持できる。
  group: security-scan
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - name: Run Trivy vulnerability scanner (fs)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4.37.6
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # コンテナイメージの中身（node:24-slim 由来の OS パッケージと、
  # Node 公式イメージ同梱の npm 自身の依存）の既知脆弱性を検出する。
  # npm audit / Dependabot alerts は lockfile が宣言する依存しか見ないため、この領域は原理的に対象外。
  #
  # caller job には name を付けない。job id にフォールバックさせることで
  # callee 側 job 名（Trivy Image Scan）との文字列重複を避ける（ADR-0008 / idp-golden-path#106）。
  #
  # image-name は backend / frontend で必ず別の値にする。SARIF は
  # category: trivy-image-<image-name> で上がるため、同じ値にすると
  # 後の upload が前を上書きし、片方の alert が黙って消える（idp-golden-path#181 で実測）。
  #
  # security-events: write は caller 側でも明示が必要。reusable workflow の job が要求する
  # permission は caller の付与範囲を超えられず、超えると job が 1 つも起動せず run 全体が失敗する。
  # upload-sarif は明示的に true を渡す。callee の input 宣言に default: true が無く、
  # workflow_call の boolean input は未指定だと false に評価されるため、
  # 省略すると SARIF アップロード step が skip される（v1.7.0 で実測。idp 側の docs は
  # 「未指定時は true」と書いているが実際は効かない）。callee 修正後も明示は無害なので残す。
  trivy-image-backend:
    uses: kmryst/idp-golden-path/.github/workflows/trivy-image.yml@v1.7.0
    permissions:
      contents: read
      security-events: write
    with:
      image-name: backend
      dockerfile: Dockerfile
      upload-sarif: true

  trivy-image-frontend:
    uses: kmryst/idp-golden-path/.github/workflows/trivy-image.yml@v1.7.0
    permissions:
      contents: read
      security-events: write
    with:
      image-name: frontend
      docker-context: frontend
      dockerfile: frontend/Dockerfile
      upload-sarif: true

  summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    permissions: {}
    needs:
      - dependency-scan
      - trivy-image-backend
      - trivy-image-frontend
    if: always()
    steps:
      - name: Check scan results
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy Image Scan (backend): ${{ needs.trivy-image-backend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy Image Scan (frontend): ${{ needs.trivy-image-frontend.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- SAST Scan (CodeQL javascript-typescript): .github/workflows/codeql.yml を参照" >> $GITHUB_STEP_SUMMARY
          echo "- IaC / Dockerfile の設定不備: .github/workflows/trivy-config-scan.yml を参照" >> $GITHUB_STEP_SUMMARY
          echo "詳細は [Security > Code scanning alerts](../../security/code-scanning) を確認" >> $GITHUB_STEP_SUMMARY
