# PR 品質チェックワークフロー
# 目的: main へマージされるコードのビルド可否・Terraform 整合性・シークレット混入を検証する
# 注意: required status check 化する前提のため path フィルタは付けない

name: pr-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    # Valkey Lua script と populated PostgreSQL migration の実挙動を required check で検証するため、
    # ローカルの docker compose と同じ service container を起動する（Issue #129 / #336）。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticket_poc
          POSTGRES_USER: ticket_poc
          POSTGRES_PASSWORD: ticket_poc_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_poc -d ticket_poc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      # search projection の実 OpenSearch 統合テスト用（Issue #377）。
      # Terraform の OpenSearch_2.19 と互換な 2.19 系を exact version で pin する（latest 禁止）。
      # local / CI では security plugin を無効化した test-only endpoint（HTTP）を使い、
      # AWS SigV4 経路と混同しない。heap は -Xms/-Xmx で bounded にする。
      opensearch:
        image: opensearchproject/opensearch:2.19.1
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          bootstrap.memory_lock: "false"
          OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate Ticket Type readiness evidence parser
        run: bash scripts/deployment/ticket-type-readiness-evidence.spec.sh

      - name: Validate ECS task container exit code lookup
        run: bash scripts/deployment/ecs-task-container-exit-code.spec.sh

      - name: Validate populated Ticket Type migration
        run: npm run test:migration:ticket-type-expand
        env:
          TEST_DATABASE_URL: postgresql://ticket_poc:ticket_poc_password@127.0.0.1:5432/ticket_poc

      - name: Validate Ticket Type compatibility writer
        run: npm run test:migration:ticket-type-compatibility
        env:
          TEST_DATABASE_URL: postgresql://ticket_poc:ticket_poc_password@127.0.0.1:5432/ticket_poc

      - name: Unit tests
        run: npm test
        env:
          TEST_VALKEY_URL: redis://127.0.0.1:6379

      # Issue #389 の「実 PostgreSQL + 実 Valkey 統合テスト」受け入れ条件を required check で
      # 証明する。TEST_DATABASE_URL はこの focused step にだけ渡す（npm test 全体へ渡すと
      # 無関係な DB suite が未準備の共有 DB 上で有効化されうるため）。
      - name: Ticket Type Valkey inventory integration (実 PostgreSQL + 実 Valkey)
        run: npx jest src/purchases/purchases.ticket-type-inventory.integration.spec.ts --runInBand
        env:
          TEST_DATABASE_URL: postgresql://ticket_poc:ticket_poc_password@127.0.0.1:5432/ticket_poc
          TEST_VALKEY_URL: redis://127.0.0.1:6379

      # Issue #377 の「実 PostgreSQL + 実 OpenSearch 統合テスト」受け入れ条件を required check で
      # 証明する。TEST_DATABASE_URL / TEST_OPENSEARCH_URL はこの focused step にだけ渡す
      # （npm test 全体へ渡すと無関係な suite が未準備の共有 store 上で有効化されうるため）。
      - name: Search projection integration (実 PostgreSQL + 実 OpenSearch 2.19)
        run: npx jest src/search/projection.integration.spec.ts --runInBand
        env:
          TEST_DATABASE_URL: postgresql://ticket_poc:ticket_poc_password@127.0.0.1:5432/ticket_poc
          TEST_OPENSEARCH_URL: http://127.0.0.1:9200

      # Issue #378 の Gate B cutover checker 統合テスト。#377 / #389 で整備済みの
      # PostgreSQL / Valkey / OpenSearch service container を再利用し、TEST_* は
      # この focused step にだけ渡す（npm test 全体へ渡すと無関係な suite が
      # 未準備の共有 store 上で有効化されうるため）。
      - name: Gate B cutover checker integration (実 PostgreSQL + 実 Valkey + 実 OpenSearch)
        run: npm run test:integration:cutover
        env:
          TEST_DATABASE_URL: postgresql://ticket_poc:ticket_poc_password@127.0.0.1:5432/ticket_poc
          TEST_VALKEY_URL: redis://127.0.0.1:6379
          TEST_OPENSEARCH_URL: http://127.0.0.1:9200

      # Issue #378 / ADR-0032 の writer mode 切替（activation / rollback）統合テスト。
      # 往復切替・差分注入 abort・lock 競合・旧 writer 復活の fence 拒否・
      # checker 不完全・control row 欠損の fail closed を required check で証明する。
      - name: Writer mode switch integration (実 PostgreSQL + 実 Valkey + 実 OpenSearch)
        run: npm run test:integration:writer-mode-switch
        env:
          TEST_DATABASE_URL: postgresql://ticket_poc:ticket_poc_password@127.0.0.1:5432/ticket_poc
          TEST_VALKEY_URL: redis://127.0.0.1:6379
          TEST_OPENSEARCH_URL: http://127.0.0.1:9200

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  terraform-validate:
    name: Terraform Format & Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.8"

      - name: Terraform fmt
        run: terraform fmt -check -recursive terraform

      - name: Terraform validate (all environment roots)
        run: |
          set -euo pipefail
          for env_dir in terraform/environments/*/; do
            echo "::group::validate ${env_dir}"
            terraform -chdir="$env_dir" init -backend=false -input=false
            terraform -chdir="$env_dir" validate -no-color
            echo "::endgroup::"
          done

  # ユーザーフロー E2E（Issue #148）。実バックエンド + 実 PostgreSQL / Valkey で
  # signup → login → イベント登録 → 検索（DB フォールバック）→ 購入（confirmed / sold_out）を検証する。
  playwright-e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ticket_poc
          POSTGRES_USER: ticket_poc
          POSTGRES_PASSWORD: ticket_poc_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ticket_poc -d ticket_poc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ticket_poc:ticket_poc_password@127.0.0.1:5432/ticket_poc
      VALKEY_URL: redis://127.0.0.1:6379
      JWT_SECRET: e2e-ci-only-secret
      COOKIE_SECURE: "false"
      PORT: "3100"
      API_PROXY_TARGET: http://127.0.0.1:3100
      API_BASE_URL: http://127.0.0.1:3100
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Apply DB schema (TypeORM migrations)
        run: npm run migration:run:local

      - name: Check Ticket Type expand readiness
        run: npm run migration:check:ticket-type-expand

      - name: Run Playwright E2E
        working-directory: frontend
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: frontend/test-results/
          retention-days: 7

  # Gitleaks Secret Scan は .github/workflows/gitleaks-secret-scan.yml に切り出した
  # （idp-golden-path の reusable workflow 化、Issue #297 / ADR-0008）。
