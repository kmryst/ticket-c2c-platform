# dev / staging 共通のアプリデプロイ reusable workflow（Issue #180 / #182）。
# deploy-backend-<env>.yml / deploy-frontend-<env>.yml から workflow_call で呼ばれ、
# デプロイ対象（ECR リポジトリ・ECS サービス群・Docker build context）と
# GitHub Environment 名を input で受け取る。backend（api + worker）/ frontend の
# どちらか一方だけをビルド・デプロイする（L-11: デプロイとロールバックの独立性）。
# 実行できる branch の制限は、呼び出し側が指定する GitHub Environment の branch restriction
# （main のみ）で行う。dev / staging の Environment に required reviewer は置かない（ADR-0038）。
# backend は DB migration（任意）→ search index migration（毎回）→ サービス更新 → rollout 確認の順に
# 進み、どこかで失敗したら以降の step を実行しない（Issue #538 / ADR-0039）。
# イメージは commit SHA タグだけを push する。terraform が作る初期タスク定義は push しない固定タグ
# pending-deploy を参照するため、アプリはこの workflow の update-service まで起動しない（Issue #543 / ADR-0040）。
# task definition の設定（環境変数・secrets・CPU / メモリ・role・sidecar 等）は terraform、イメージはこの workflow が
# 受け持つ。コピー元は terraform が最後の apply で登録した revision（state の output ecs_task_definition_arns）で、
# service が今使っている revision や family の最新 revision ではない（Issue #544 / ADR-0042）。
# concurrency group は呼び出し側 workflow で定義する。terraform apply / destroy と同じ group
# （mutation-<env>）で直列化する（ADR-0042）。
name: deploy-service

on:
  workflow_call:
    inputs:
      environment:
        description: "apply ロールを引き受ける GitHub Environment 名（dev / staging）。branch restriction（main のみ）で実行元を制限する。required reviewer は置かない（ADR-0038）"
        required: true
        type: string
      ecr_repository:
        description: "デプロイ対象イメージの ECR リポジトリ名"
        required: true
        type: string
      ecs_cluster:
        description: "ECS クラスタ名"
        required: true
        type: string
      ecs_services:
        description: "更新する ECS サービス名（空白区切り。backend: api + worker / frontend: frontend のみ）"
        required: true
        type: string
      docker_context:
        description: "docker build の context（backend: リポジトリルート '.' / frontend: 'frontend'）"
        required: true
        type: string
      terraform_dir:
        description: "task definition の ARN を読む terraform の環境 root（例: terraform/environments/staging）。output ecs_task_definition_arns を state から読む（ADR-0042）"
        required: true
        type: string
      api_service:
        description: "DB migration / search index migration の run-task に使う API サービス名（backend のみ指定）"
        required: false
        type: string
        default: ""
      image_tag:
        description: "デプロイする既存 ECR タグ（省略時は現在のコミットをビルドし short SHA タグでデプロイ。ロールバック時は過去の short SHA を指定。latest / pending-deploy は拒否する）"
        required: false
        type: string
        default: ""
      run_migrations:
        description: "サービス更新前に DB migration を実行する（スキーマ変更を含むリリース時。migration 失敗時はデプロイを中断）"
        required: false
        type: boolean
        default: false
      run_search_index_migration:
        description: "サービス更新前に OpenSearch の events index を作成・mapping を additive に適用する（backend のみ true。冪等。失敗時はデプロイを中断。ADR-0039）"
        required: false
        type: boolean
        default: false
      skip_if_services_missing:
        description: "ECS サービスが ACTIVE でない場合にサービス更新をスキップする（staging alb-http-only では frontend service が存在しないため。ADR-0011）"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  ECR_REPOSITORY: ${{ inputs.ecr_repository }}
  ECS_CLUSTER: ${{ inputs.ecs_cluster }}
  ECS_SERVICES: ${{ inputs.ecs_services }}
  # terraform の image_tag 変数の既定値（terraform/environments/{dev,staging}/variables.tf の validation が
  # この値だけを許可する）。初期タスク定義が pull できないよう、このタグは push もデプロイもしない。
  PENDING_DEPLOY_IMAGE_TAG: pending-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 更新対象サービスの存在確認。staging の alb-http-only モードでは frontend service が
      # 存在しないため（ADR-0011）、skip_if_services_missing = true の呼び出し（frontend）は
      # サービス更新をスキップする（イメージの build / push は行う）。backend は即失敗させる。
      - name: Check ECS services are active
        id: svc
        run: |
          ACTIVE=true
          for SVC in $ECS_SERVICES; do
            STATUS=$(aws ecs describe-services \
              --cluster "$ECS_CLUSTER" --services "$SVC" \
              --query 'services[0].status' --output text 2>/dev/null || echo "MISSING")
            if [ "$STATUS" != "ACTIVE" ]; then
              ACTIVE=false
              echo "$SVC is not active ($STATUS)"
            fi
          done
          if [ "$ACTIVE" != "true" ]; then
            if [ "${{ inputs.skip_if_services_missing }}" != "true" ]; then
              echo "::error::ECS service(s) not active in cluster $ECS_CLUSTER"
              exit 1
            fi
            echo "service(s) not active, service update will be skipped" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "deploy=$ACTIVE" >> "$GITHUB_OUTPUT"

      # terraform の state から output を読むためだけに使う（plan / apply はしない）。
      # output の生値を取るため wrapper は無効化する（staging-smoke-test.yml と同じ）。
      - name: Setup Terraform
        if: steps.svc.outputs.deploy == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.8"
          terraform_wrapper: false

      # コピー元の task definition を決める（Issue #544 / ADR-0042）。terraform が最後の apply で登録した
      # revision の ARN（revision 番号まで含む）を state の output ecs_task_definition_arns から読む。
      # service が今使っている revision をコピーすると、ecs-service モジュールの ignore_changes = [task_definition]
      # により terraform の設定変更が永久に届かない。family の最新 ACTIVE revision は、deploy が register した
      # revision や失敗した deploy の revision の方が新しくなるので使わない。
      # 次のどれかに当たれば、イメージの push・register・migration・update-service の前に失敗する。
      # - output が無い、または service のキーが無い（その環境に一度も apply していない、apply 前のコード）
      # - ARN の family が service 名と違う、revision 番号が無い
      # - その revision のアプリコンテナが service 名でない、またはイメージが pending-deploy でない
      #   （terraform が登録した revision は必ず pending-deploy を参照する。ADR-0040）
      - name: Resolve terraform task definitions
        if: steps.svc.outputs.deploy == 'true'
        env:
          TERRAFORM_DIR: ${{ inputs.terraform_dir }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if ! terraform -chdir="$TERRAFORM_DIR" init -input=false -no-color > terraform-init.log 2>&1; then
            cat terraform-init.log
            echo "::error::terraform init failed in $TERRAFORM_DIR"
            exit 1
          fi
          if ! terraform -chdir="$TERRAFORM_DIR" output -json ecs_task_definition_arns > tf-task-definitions.json; then
            echo "::error::terraform output ecs_task_definition_arns is not in the state of $TERRAFORM_DIR. Run terraform-apply-<env>.yml first (Issue #544 / ADR-0042)"
            exit 1
          fi
          EXPECTED_IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${PENDING_DEPLOY_IMAGE_TAG}"
          : > td-source.txt
          for SVC in $ECS_SERVICES; do
            SOURCE_TD=$(jq -r --arg svc "$SVC" '.[$svc] // empty' tf-task-definitions.json)
            if [ -z "$SOURCE_TD" ]; then
              echo "::error::terraform output ecs_task_definition_arns has no entry for $SVC. Run terraform-apply-<env>.yml first (Issue #544 / ADR-0042)"
              exit 1
            fi
            if ! [[ $SOURCE_TD =~ ^arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:task-definition/${SVC}:[0-9]+$ ]]; then
              echo "::error::unexpected task definition ARN for $SVC in terraform output: $SOURCE_TD"
              exit 1
            fi
            aws ecs describe-task-definition \
              --task-definition "$SOURCE_TD" \
              --query 'taskDefinition' > "td-source-${SVC}.json"
            NAME=$(jq -r '.containerDefinitions[0].name' "td-source-${SVC}.json")
            SOURCE_IMAGE=$(jq -r '.containerDefinitions[0].image' "td-source-${SVC}.json")
            if [ "$NAME" != "$SVC" ] || [ "$SOURCE_IMAGE" != "$EXPECTED_IMAGE" ]; then
              echo "::error::$SOURCE_TD is not a task definition registered by terraform (containerDefinitions[0]: name=$NAME image=$SOURCE_IMAGE, expected name=$SVC image=$EXPECTED_IMAGE)"
              exit 1
            fi
            echo "$SVC $SOURCE_TD" >> td-source.txt
            echo "terraform task definition for $SVC: ${SOURCE_TD##*/}" >> "$GITHUB_STEP_SUMMARY"
          done

      # デプロイするタグを決める（production-readiness M-7: タスク定義は commit SHA 固定で参照する）。
      # image_tag 入力があればビルドせず既存タグを使う（ロールバック経路）。存在しないタグは即失敗させる。
      # pending-deploy（terraform の初期タスク定義が参照する、push しないタグ）と latest（Issue #543 より前の
      # 可変タグ）は拒否する。どちらも commit を特定できず、pending-deploy を push すると terraform apply 直後に
      # migration 前のアプリが起動してしまう（ADR-0040）。
      # タグ存在確認は自分の ECR リポジトリのみ行う（L-11: backend / frontend でタグを同期しない。
      # 各 workflow が自分のビルド時点の short SHA を独立して使い、ロールバックも workflow 単位で行う）。
      - name: Resolve image tag
        id: tag
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
            if [ "$TAG" = "$PENDING_DEPLOY_IMAGE_TAG" ] || [ "$TAG" = "latest" ]; then
              echo "::error::image_tag '$TAG' cannot be deployed. Specify a past short SHA tag (Issue #543 / ADR-0040)"
              exit 1
            fi
            aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$TAG" \
              --query 'imageDetails[0].imagePushedAt' --output text
            echo "rollback to existing tag $TAG" >> "$GITHUB_STEP_SUMMARY"
          else
            TAG="${GITHUB_SHA::7}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # commit SHA タグだけを push する。latest は push しない（Issue #543 / ADR-0040）。
      # migration より前に latest を push すると、terraform apply 直後の初期 deployment が
      # そのイメージで起動し、DB migration / search index migration より前にアプリが動いていた。
      - name: Build and push image
        if: inputs.image_tag == ''
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}"
          TAG="${{ steps.tag.outputs.tag }}"
          if [ "$TAG" = "$PENDING_DEPLOY_IMAGE_TAG" ] || [ "$TAG" = "latest" ]; then
            echo "::error::refusing to push image tag '$TAG' (Issue #543 / ADR-0040)"
            exit 1
          fi
          docker build -t "$IMAGE:$TAG" "${{ inputs.docker_context }}"
          docker push "$IMAGE:$TAG"
          echo "pushed $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"

      # terraform が登録した revision（Resolve terraform task definitions）のイメージだけを commit SHA タグへ
      # 差し替えた新リビジョンを register する（Issue #544 / ADR-0042）。設定は terraform の最新の apply のもの、
      # イメージは今回のタグになる。これによりタスク定義から稼働コミットを特定でき、ロールバックは過去タグの
      # 再指定だけで済む（再ビルド不要。設定は戻らず、現在の terraform の設定のままになる）。
      # register した revision を DB migration / search index migration と update-service に使う。
      - name: Register SHA-pinned task definitions
        if: steps.svc.outputs.deploy == 'true'
        id: td
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${{ steps.tag.outputs.tag }}"
          : > td-map.txt
          while read -r SVC SOURCE_TD; do
            jq --arg image "$IMAGE" '
              del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy, .deregisteredAt)
              | .containerDefinitions[0].image = $image
            ' "td-source-${SVC}.json" > td-new.json
            NEW_TD=$(aws ecs register-task-definition \
              --cli-input-json file://td-new.json \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            echo "registered $SVC -> ${NEW_TD##*/} (from ${SOURCE_TD##*/}, $IMAGE)" >> "$GITHUB_STEP_SUMMARY"
            echo "$SVC $NEW_TD" >> td-map.txt
            if [ -n "${{ inputs.api_service }}" ] && [ "$SVC" = "${{ inputs.api_service }}" ]; then
              echo "td_api=$NEW_TD" >> "$GITHUB_OUTPUT"
            fi
          done < td-source.txt

      # スキーマ変更を含むリリースでは、migration 成功後にサービス更新へ進む（Issue #92）。
      # 新イメージのタスク定義（command override）で migration を実行するため、
      # 旧タスクは旧スキーマのまま動き続け、失敗時はデプロイ自体が中断される。
      - name: Run DB migration (before service update)
        if: inputs.run_migrations && steps.svc.outputs.deploy == 'true'
        # 明示的な shell: bash で pipefail を有効化し、tee が migration 失敗の exit code を隠さないようにする
        shell: bash
        run: |
          ./scripts/deployment/run-db-migration.sh "$ECS_CLUSTER" "${{ inputs.api_service }}" \
            "${{ steps.td.outputs.td_api }}" | tee -a "$GITHUB_STEP_SUMMARY"

      # OpenSearch の events index を作成する、または既存 index に mapping を additive に適用する
      # （Issue #538 / ADR-0039）。worker は起動時に index の存在だけを確認し、無ければ
      # EventsIndexMissingError で exit 1 する（#396）。新しい worker を起動する前に毎回実行し、
      # 新しい環境（OpenSearch が空）でも worker が起動できるようにする。
      # search-index-migrate CLI は冪等（index が無ければ作成、あれば putMapping）なので毎回実行してよい。
      # DB migration と同じく新イメージの API タスク定義（command override）で ECS run-task から実行する。
      # 失敗した場合はこの step が失敗し、後続の Update services は実行されない（サービスは旧タスクのまま）。
      - name: Run search index migration (before service update)
        if: inputs.run_search_index_migration && steps.svc.outputs.deploy == 'true'
        shell: bash
        run: |
          ./scripts/deployment/run-db-migration.sh "$ECS_CLUSTER" "${{ inputs.api_service }}" \
            "${{ steps.td.outputs.td_api }}" search-index-migration | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Update services
        if: steps.svc.outputs.deploy == 'true'
        run: |
          while read -r SVC NEW_TD; do
            aws ecs update-service \
              --cluster "$ECS_CLUSTER" --service "$SVC" \
              --task-definition "$NEW_TD" \
              --query 'service.serviceName' --output text
            echo "updated $SVC -> ${NEW_TD##*/}" >> "$GITHUB_STEP_SUMMARY"
          done < td-map.txt

      # 成功判定（Issue #538 / ADR-0039）。`aws ecs wait services-stable` は deployments 件数と
      # runningCount をその時点の観測だけで判定し、rolloutState と circuit breaker の結果を見ないため、
      # 起動直後に落ちる worker でも success になっていた。対象サービスすべてについて、PRIMARY
      # deployment が今回の task definition であること・rolloutState=COMPLETED・circuit breaker の
      # FAILED / rollback が無いこと・running が desired と一致することを、連続した poll で確認する。
      - name: Wait for ECS rollout completed
        if: steps.svc.outputs.deploy == 'true'
        shell: bash
        run: |
          ./scripts/deployment/wait-ecs-rollout.sh "$ECS_CLUSTER" td-map.txt
          echo "ECS rollout completed: $ECS_SERVICES" >> "$GITHUB_STEP_SUMMARY"
