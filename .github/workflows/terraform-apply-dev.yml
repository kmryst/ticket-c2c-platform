# dev 専用の terraform apply workflow（staging-environment.md「GitHub Actions」）。
# 環境選択入力は持たない。GitHub Environment `dev` は branch restriction（main のみ）で、required reviewer は置かない。
name: terraform-apply-dev

on:
  workflow_dispatch:
    inputs:
      task_config_check_value:
        description: "AWS での確認用に api / worker / frontend の task definition へ入れる環境変数 TASK_CONFIG_CHECK_VALUE の値（アプリは読まない。空なら入れない。Issue #544 / ADR-0042）"
        required: false
        type: string
        default: ""
      enable_synthetic_check:
        description: "外形監視（CloudWatch Synthetics canary）を作る。最初の apply は false、deploy-backend → deploy-frontend の後の 2 回目の apply から true（作成済みの環境で false にすると削除の計画になり、apply の前に失敗する。Issue #546 / ADR-0043）"
        required: true
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  # dev を変更する workflow（terraform apply / destroy、backend / frontend deploy、DB migration、
  # Ticket Type readiness / cutover）を 1 つの group で直列化する（Issue #544 / ADR-0042）。
  # deploy は terraform が最後の apply で登録した task definition を state から読むため、apply と並行させない。
  # concurrency は排他制御のためだけに使う。queue: max は待機中の run を cancel せずに保持するだけで、
  # 実行順は保証されない（GitHub Docs: "ordering is not guaranteed"）。apply → deploy の順序は運用で守る
  # （apply の run が success で完了してから deploy を起動する。ADR-0042 / docs/runbooks/apply-task-definition-config-change.md）。
  group: mutation-dev
  queue: max

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: dev
    defaults:
      run:
        working-directory: terraform/environments/dev
    env:
      TF_VAR_task_config_check_value: ${{ inputs.task_config_check_value }}
      TF_VAR_enable_synthetic_check: ${{ inputs.enable_synthetic_check }}
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.8"
          # plan の JSON（terraform show -json）をファイルへ書き出すため wrapper を無効化する（Issue #546）
          terraform_wrapper: false

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform plan
        run: terraform plan -input=false -no-color -out=tfplan.bin

      # Issue #546 / ADR-0043: 外形監視（module.synthetic_check）のリソースを削除する計画（replace を含む）なら、
      # 入力 enable_synthetic_check の値に関係なく apply の前に失敗させる（作成済みの環境を false で apply する事故、
      # moved の書き忘れによる canary の作り直しを防ぐ）。外形監視を外す場合は terraform-destroy-dev.yml を使う。
      - name: Check synthetic check deletion in plan
        run: |
          terraform show -json tfplan.bin > tfplan.json
          "$GITHUB_WORKSPACE/scripts/deployment/check-synthetic-check-plan.sh" tfplan.json

      - name: Terraform apply
        run: terraform apply -input=false -no-color tfplan.bin

      - name: Outputs
        run: |
          {
            echo "enable_synthetic_check: ${{ inputs.enable_synthetic_check }}"
            terraform output -no-color
          } >> "$GITHUB_STEP_SUMMARY"
