# staging 専用の frontend（Next.js SSR）デプロイ workflow（L-11 / Issue #182）。
# 環境選択入力は持たない。GitHub Environment `staging` は branch restriction（main のみ）で、required reviewer は置かない（ADR-0038）。
# デプロイ手順本体は deploy-service.yml（reusable workflow。Issue #180）に共通化し、
# このファイルは staging の frontend 固有値を渡すだけにする。
# backend のデプロイは deploy-backend-staging.yml（タグ・ロールバックは互いに独立）。
name: deploy-frontend-staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "デプロイする既存 ECR タグ（省略時は現在のコミットをビルドし short SHA タグでデプロイ。ロールバック時は過去の short SHA を指定。latest / pending-deploy は拒否する）"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  # staging を変更する workflow（terraform apply / destroy、backend / frontend deploy、DB migration、
  # Ticket Type readiness / cutover）を 1 つの group で直列化する（Issue #544 / ADR-0042）。
  # deploy は terraform が最後の apply で登録した task definition を state から読むため、apply と並行させない。
  # concurrency は排他制御のためだけに使う。queue: max は待機中の run を cancel せずに保持するだけで、
  # 実行順は保証されない（GitHub Docs: "ordering is not guaranteed"）。apply → deploy の順序は運用で守る
  # （apply の run が success で完了してから deploy を起動する。ADR-0042 / docs/runbooks/apply-task-definition-config-change.md）。
  group: mutation-staging
  queue: max

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      environment: staging
      ecr_repository: ticket-c2c-staging-frontend
      ecs_cluster: ticket-c2c-staging
      # task definition のコピー元（terraform が最後の apply で登録した revision）を読む state（ADR-0042）。
      terraform_dir: terraform/environments/staging
      ecs_services: "ticket-c2c-staging-frontend"
      docker_context: "frontend"
      image_tag: ${{ inputs.image_tag }}
      # staging の alb-http-only モードでは frontend service が存在しないためスキップする（ADR-0011）。
      skip_if_services_missing: true
