# staging 専用の backend（api + worker）デプロイ workflow（L-11 / Issue #182）。
# 環境選択入力は持たない。GitHub Environment `staging` は branch restriction（main のみ）で、required reviewer は置かない（ADR-0038）。
# デプロイ手順本体は deploy-service.yml（reusable workflow。Issue #180）に共通化し、
# このファイルは staging の backend 固有値を渡すだけにする。
# frontend のデプロイは deploy-frontend-staging.yml（タグ・ロールバックは互いに独立）。
name: deploy-backend-staging

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "デプロイする既存 ECR タグ（省略時は現在のコミットをビルドし short SHA タグでデプロイ。ロールバック時は過去の short SHA を指定。latest / pending-deploy は拒否する）"
        required: false
        type: string
      run_migrations:
        description: "サービス更新前に DB migration を実行する（スキーマ変更を含むリリース時。migration 失敗時はデプロイを中断）"
        required: false
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  # staging を変更する workflow（terraform apply / destroy、backend / frontend deploy、DB migration、
  # Ticket Type readiness / cutover）を 1 つの group で直列化する（Issue #544 / ADR-0042）。
  # deploy は terraform が最後の apply で登録した task definition を state から読むため、apply と並行させない。
  # 既定（queue: single）は待機中の run を 1 件しか持たず、後から起動した run が待機中の run を cancel する。
  # queue: max で待機中の run を cancel せず起動順に実行する（pr-policy-check.yml / Issue #220 と同じ）。
  group: mutation-staging
  queue: max

jobs:
  deploy:
    uses: ./.github/workflows/deploy-service.yml
    with:
      environment: staging
      ecr_repository: ticket-c2c-staging
      ecs_cluster: ticket-c2c-staging
      # task definition のコピー元（terraform が最後の apply で登録した revision）を読む state（ADR-0042）。
      terraform_dir: terraform/environments/staging
      ecs_services: "ticket-c2c-staging-api ticket-c2c-staging-worker"
      docker_context: "."
      api_service: ticket-c2c-staging-api
      image_tag: ${{ inputs.image_tag }}
      run_migrations: ${{ inputs.run_migrations }}
      # worker を起動する前に OpenSearch の events index を毎回作成・更新する（Issue #538 / ADR-0039）。
      run_search_index_migration: true
