# Issue #335 Rollout Gate A の staging 専用 readiness workflow。
# 現行 API task definition を ECS RunTask で流用し、private Aurora 上の
# Ticket Type expand schema を読み取り専用で検査する。DB schema / data は変更しない。
name: ticket-type-expand-readiness-staging

on:
  workflow_dispatch:
    inputs:
      task_definition_arn:
        description: "通常は空欄。migration後のservice更新だけ失敗した場合は、そのdeploy logに記録された新task definition ARNを指定"
        required: false
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  # staging を変更する workflow（terraform apply / destroy、backend / frontend deploy、DB migration、
  # Ticket Type readiness / cutover）を 1 つの group で直列化する（Issue #544 / ADR-0042）。
  # deploy は terraform が最後の apply で登録した task definition を state から読むため、apply と並行させない。
  # 既定（queue: single）は待機中の run を 1 件しか持たず、後から起動した run が待機中の run を cancel する。
  # queue: max で待機中の run を cancel せず起動順に実行する（pr-policy-check.yml / Issue #220 と同じ）。
  group: mutation-staging
  queue: max

jobs:
  readiness:
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check Ticket Type expand readiness
        shell: bash
        env:
          TASK_DEFINITION_ARN: ${{ inputs.task_definition_arn }}
        run: |
          set -o pipefail
          task_definition="${TASK_DEFINITION_ARN:-current}"
          ./scripts/deployment/run-db-migration.sh \
            ticket-c2c-staging \
            ticket-c2c-staging-api \
            "$task_definition" \
            ticket-type-readiness 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
