# Dependabot 設定
# 目的: npm / GitHub Actions / Terraform の依存関係更新を週次で自動追従する
# 有効な ignore の横断一覧: https://github.com/search?q=user%3Akmryst+label%3Adependabot-ignore+is%3Aissue+is%3Aopen&type=issues
#
# groups の方針（terraform-hannibal / idp-golden-path と揃える。Issue #447）:
# - 同じ lockfile を触る密結合な依存群は 1 グループ = 1 PR にまとめる。
#   1 依存 1 PR のままだと、1 件マージするたびに残りが rebase 待ちになる
#   （実測: PR #430 `@opentelemetry/sdk-node` と PR #436 `@opentelemetry/context-async-hooks` が
#    root の package-lock.json で競合し、#430 マージ後に #436 の自動 rebase を待った）。
# - devDependencies は `npm-dev` グループに集約し、production 依存は原則個別 PR のまま残す
#   （本番影響のある更新は 1 件ずつ見たいため）。ただし上記のとおり密結合な
#   production 依存群だけは例外的にグループ化する。
# - Dependabot は「複数グループにマッチする依存は最初にマッチしたグループに入る」
#   （first-match-wins）ため、catch-all の `npm-dev` は必ず最後に置く。
#   個別グループを `npm-dev` より後ろに置くと、その群の devDependencies 側が
#   先に `npm-dev` へ吸われてグループが分裂する。
# - グループに `update-types` は指定せず major も同じ PR に含める
#   （terraform-hannibal / idp-golden-path と同じ挙動。破壊的更新を単独で切り出したい
#    ケースは、これまでどおり `ignore` + 追跡 Issue で個別に扱う）。
#
# 運用メモ: `groups` を追加しても既存の open な Dependabot PR は自動統合されない。
# `@dependabot recreate` でも統合されず、GitHub Web UI の
# Insights > Dependency graph > Dependabot で "Check for updates" の手動実行が必要。

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    # root は production 依存 28 件のうち 18 件を 3 グループへ集約するが、
    # 残る 10 件は個別 PR のまま（+ npm-dev グループ 1 件）。
    # limit 5 だと週によっては更新が埋もれるため 10 とする
    # （grouping 前の最悪ケース 40 PR 超に比べれば十分小さい）。
    open-pull-requests-limit: 10
    groups:
      # @opentelemetry/* は prod 10 件 + dev 1 件（context-async-hooks）に分かれているが、
      # SDK / instrumentation / exporter がバージョン連動するため実質ひとかたまり。
      # dependency-type は指定しない。指定すると dev 側の context-async-hooks が
      # このグループから外れ、今回競合したのと同じ prod / dev 分裂が再発する。
      # npm-dev より前に置く（first-match-wins）。
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      # @aws-sdk/* は client / credential-provider が常に同一バージョンへ揃うリリース形態のため、
      # 個別 PR にすると必ず lockfile が競合する。全 4 件とも production 依存。
      aws-sdk:
        patterns:
          - "@aws-sdk/*"
      # @nestjs/* も common / core / platform-fastify が相互に peer 依存しており、
      # 単独更新すると peer 不整合で npm ci が失敗しうる。全 4 件とも production 依存。
      nestjs:
        patterns:
          - "@nestjs/*"
      npm-dev:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # TypeScript 7 は ts-jest が未対応。
      # 実測: ts-jest@29.4.12（本リポジトリ現行、npm latest も同一）の peer は typescript ">=4.3 <7"（2026-08-09 npm view）。
      # 影響: Dependabot PR #343（6.0.3→7.0.2）で Backend Build / Playwright E2E が失敗。
      # 本番影響なし: typescript は devDependency でビルド時のみ。
      # 解除条件: ts-jest の peer から <7 の上限が外れ、typescript@7 で build / test が通ったら。
      # frontend の typescript major はブロック元が別（typescript-eslint）のため追跡 Issue を分ける。
      # 見直し期限: 2026-11-02（terraform-hannibal #542 / idp-golden-path #146 の棚卸し時期と揃える）
      # 追跡: Issue #425
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # fastify は @nestjs/platform-fastify が exact pin しているため単独更新しない（全 update-types）。
      # 実測: @nestjs/platform-fastify の dependencies.fastify は範囲ではなく固定値
      #   （11.1.28 → "5.10.0"、11.1.29 → "5.11.0"。2026-08-10 npm view）。
      #   root の package.json は "fastify": "^5.9.0"、fastify の npm latest は 5.11.3 で pin は常に最新より遅れる。
      #   本リポジトリの dist/ に require('fastify') は 0 件で、root の fastify は型定義としてしか使われていない。
      # 影響: Dependabot PR #454（5.10.0→5.11.2）。単独更新は実行時に効果がなく、
      #   node_modules/@nestjs/platform-fastify/node_modules/fastify の重複を増やすだけ。
      #   HTTP を捌くのは pin された platform-fastify 配下のインスタンス。
      # 取り残されない: fastify 本体は nestjs グループ（@nestjs/*）の更新に追従して自動的に上がる。
      # patch / minor も除外する: pin を超えれば更新種別に関わらず同じ重複が起きるため。
      # 解除条件: `npm view @nestjs/platform-fastify dependencies.fastify` が
      #   範囲指定（例 "^5.11.0"）を返したら解除できる。固定値を返す限り維持する。
      # 恒久措置: 既存 3 件と違い上流の待ちではなく構造対応。上流が exact pin をやめない限り解除しない。
      # 見直し期限: 2026-11-02（既存 ignore 3 件と揃える。期限到来で自動解除はしない）
      # 追跡: Issue #455
      - dependency-name: "fastify"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    # frontend は production 依存 3 件がすべてグループに入るため、
    # 週あたり最大でも react / next / npm-dev の 3 PR。5 で足りる。
    open-pull-requests-limit: 5
    groups:
      # react / react-dom と @types/react* は密結合しており、単独更新すると
      # 相方が取り残されて CI が壊れる（idp-golden-path PR #53 / #54 / #56 で発生）。
      # @types/react* を npm-dev ではなくこのグループへ入れるため npm-dev より前に置く。
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # eslint-config-next は next の major に追随する必要がある
      # （現行: next 16.3.0 / eslint-config-next 16.2.12）。
      # eslint-config-next は devDependency のため、npm-dev より前に置かないと
      # そちらへ吸われて next 本体と別 PR に分かれる。
      next:
        patterns:
          - "next"
          - "eslint-config-next"
      npm-dev:
        dependency-type: "development"
        patterns:
          - "*"
    ignore:
      # TypeScript 6.1 以降は typescript-eslint が未対応。
      # 実測: typescript-eslint@8.66.0（npm latest。本リポジトリは 8.62.1）の peer は typescript ">=4.8.4 <6.1.0"（2026-08-09 npm view）。
      # 影響: Dependabot PR #353（5.9.3→7.0.2）で Frontend Build / Playwright E2E が失敗。
      # 本番影響なし: typescript は devDependency でビルド時のみ。
      # 解除条件: typescript-eslint の peer から <6.1.0 の上限が外れ、typescript@7 で build / lint が通ったら。
      # 見直し期限: 2026-11-02（root typescript / terraform-hannibal #542 と揃える）
      # 追跡: Issue #426
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # ESLint 10 は eslint-plugin-react が未対応。
      # 実測: eslint-plugin-react@7.37.5 の peer eslint は "^3||^4||^5||^6||^7||^8||^9.7" で ^10 なし（2026-08-09 npm view）。
      # 影響: Dependabot PR #356（9.39.4→10.8.0）で Frontend Build が失敗。
      # 本番影響なし: eslint は devDependency で lint 時のみ。
      # 解除条件: eslint-plugin-react の peer が eslint ^10 を許容し、eslint@10 で lint が通ったら。
      # 見直し期限: 2026-11-02（他 2 件と揃える）
      # 追跡: Issue #427
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    # グループ 1 つに集約されるため 5 で十分。
    open-pull-requests-limit: 5
    groups:
      # Actions の更新は workflow ファイルの参照 SHA / タグを書き換えるだけで
      # lockfile を持たないが、1 action 1 PR だとレビュー対象が無駄に増える。
      # terraform-hannibal / idp-golden-path と同じく全件を 1 グループにまとめる。
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directories:
      - "/terraform/environments/bootstrap"
      - "/terraform/environments/dev"
      - "/terraform/environments/staging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Tokyo"
    # グループ 1 つに集約されるため 5 で十分。
    open-pull-requests-limit: 5
    groups:
      # provider のバージョンは bootstrap / dev / staging で揃えたい。
      # 個別 PR だと環境ごとに .terraform.lock.hcl がずれ、
      # Terraform Format & Validate の結果が環境間で食い違う原因になる。
      terraform-providers:
        patterns:
          - "*"
